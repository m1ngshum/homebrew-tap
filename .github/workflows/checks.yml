name: Formula checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: formula
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the checked-out formula
        run: |
          brew tap m1ngshum/tap "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula m1ngshum/tap/vpn-pin
          fi
          brew install --build-from-source m1ngshum/tap/vpn-pin
          brew test m1ngshum/tap/vpn-pin
          vpn-pin --version
